name: Update README with latest blog post

on:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    if: github.event_name == 'schedule' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Get latest blog post
        run: python get_latest_blog_post.py > latest_post.md

      - name: Update README
        run: |
          set -euo pipefail
          test -s latest_post.md
          latest_post=$(cat latest_post.md)
          rm -f latest_post.md
          echo "Updating README.md with latest blog post:"
          echo "${latest_post}"
          grep -q '<!-- BLOG-POST-START -->' README.md
          grep -q '<!-- BLOG-POST-END -->' README.md
          sed -i '/<!-- BLOG-POST-START -->/,/<!-- BLOG-POST-END -->/c\<!-- BLOG-POST-START -->\n'"${latest_post}"'\n<!-- BLOG-POST-END -->' README.md
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date"
            exit 0
          fi
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Update README with latest blog post'
          git push
